<div
  class="container"
  [class.dark]="darkMode"
>

  <div class="todo-card">

    <div class="top-bar">

      <h1>✨ Colorful Todo App</h1>

      <button
        class="theme-btn"
        (click)="toggleTheme()"
      >
        {{ darkMode ? '☀️' : '🌙' }}
      </button>

    </div>

    <div class="stats">

      <p>Total: {{ tasks.length }}</p>

      <p>
        Completed:
        {{
          tasks.filter(task => task.completed).length
        }}
      </p>

    </div>

    <div class="todo-input">

      <input
        type="text"
        placeholder="Enter a task..."
        [(ngModel)]="task"
      />

      <button (click)="addTask()">

        {{
          editIndex !== null
            ? '💾 Update'
            : '➕ Add'
        }}

      </button>

    </div>

    <p
      class="empty-message"
      *ngIf="tasks.length === 0"
    >
      🚀 No tasks available
    </p>

    <ul>

      <li *ngFor="let item of tasks; let i = index">

        <span
          [class.completed]="item.completed"
        >
          {{ item.text }}
        </span>

        <div class="actions">

          <button
            class="edit-btn"
            (click)="editTask(i)"
          >
            ✏️
          </button>

          <button
            class="complete-btn"
            (click)="toggleTask(i)"
          >
            ✅
          </button>

          <button
            class="delete-btn"
            (click)="deleteTask(i)"
          >
            ❌
          </button>

        </div>

      </li>

    </ul>

  </div>

</div>
